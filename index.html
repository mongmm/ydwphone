.homebtn::after{content:"";position:absolute;inset:7%;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.homebtn:active{transform:scale(.96)}
.inner{position:absolute;left:var(--sx);top:var(--top);width:var(--sw);height:var(--sh);overflow:hidden;background:#000;font-size:var(--fs);color:var(--fg);isolation:isolate;cursor:default;z-index:2;box-shadow:0 0 0 1px #111}
.inner.offing{animation:offing .35s ease-in forwards}
@keyframes offing{to{filter:brightness(0)}}
.wake{animation:wake .45s ease-out both}
@keyframes wake{from{filter:brightness(0)}}

/* ── shared screen bits ── */
.wall{position:absolute;inset:0;background-size:cover;background-position:50% 35%;z-index:0;background-color:var(--wallc,#8e8e93)}
.wall .wnew{position:absolute;inset:0;background-size:cover;background-position:50% 30%;opacity:0;transition:opacity 1.8s ease}
.wall .wnew.on{opacity:1}
.wall .wnew.ph{display:grid;place-items:center;background:linear-gradient(160deg,#5b5e66,#2d2f35);color:rgba(255,255,255,.55);font-size:.8em;letter-spacing:.04em}
.wall.ph{background:radial-gradient(60% 45% at 30% 25%,rgba(122,140,214,.55),transparent 70%),radial-gradient(55% 50% at 78% 70%,rgba(214,128,160,.38),transparent 70%),radial-gradient(40% 30% at 60% 40%,rgba(255,214,170,.18),transparent 70%),linear-gradient(170deg,#141a2e,#1d1730 55%,#0e0f18)}
.wall.dim::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.18)}
.sb{position:absolute;left:0;right:0;top:0;height:1.6em;z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 .5em;font-size:.72em;font-weight:600;color:#fff;pointer-events:none;font-variant-numeric:tabular-nums}
.sb .l{display:flex;align-items:center;gap:.3em}
.sb .r{justify-self:end}
.inner.dk .sb{color:#000}
.sb .ic{display:flex;align-items:center;gap:.35em}
.sb svg{height:1.05em;width:auto;fill:currentColor}
.view{position:absolute;inset:0;z-index:1}
.nav{position:absolute;left:0;right:0;bottom:0;height:2.7em;z-index:35;display:flex;align-items:center;justify-content:space-around;padding:0 18%;color:#e6e8ec}
.nav button{width:3em;height:2.4em;display:grid;place-items:center;opacity:.9}
.nav svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2}
.off{position:absolute;inset:0;background:#000;display:grid;place-items:center;z-index:5}
.off span{font-size:.82em;color:rgba(255,255,255,.28);letter-spacing:.06em}
.boot{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4em;z-index:6}
.ring{width:3em;height:3em}
.ring circle{fill:none;stroke-width:3;stroke-linecap:round}
.ring .tr{stroke:rgba(255,255,255,.12)}
.ring .ar{stroke:#cfd6ff;stroke-dasharray:60 200;transform-origin:50% 50%;animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.boot .who{font-size:.95em;color:rgba(255,255,255,.75);letter-spacing:.04em;animation:fadein 1s ease both}
@keyframes fadein{from{opacity:0}}

/* lock (cover + inner) */
.lock{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:2.4em var(--gx) 1.2em;color:#fff;cursor:pointer}
.lclock{font-size:3.6em;font-weight:300;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;text-shadow:0 1px 12px rgba(0,0,0,.25)}
.ldate{font-size:.9em;font-weight:500;margin-top:.5em;opacity:.95;text-shadow:0 1px 6px rgba(0,0,0,.3)}
.lweather{font-size:.78em;opacity:.85;margin-top:.25em;display:flex;align-items:center;gap:.35em}
.lweather svg{width:1.2em;height:1.2em}
.lhead{text-align:center;display:flex;flex-direction:column;align-items:center}
.nstack{position:relative;flex:1;min-height:0;margin-top:1.1em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 75%,transparent);mask-image:linear-gradient(180deg,#000 75%,transparent)}
.nwrap{display:grid;grid-template-rows:1fr}
.nwrap.in{animation:growrow .34s cubic-bezier(.2,.8,.2,1) both}
.nwrap>div{min-height:0;overflow:hidden}
@keyframes growrow{from{grid-template-rows:0fr}to{grid-template-rows:1fr}}
.nwrap.in .ncard{animation:dropin .34s cubic-bezier(.2,.8,.2,1) both}
@keyframes dropin{from{transform:translateY(-70%);opacity:0}}
.ncard{display:flex;gap:.65em;align-items:flex-start;background:rgba(245,245,247,.82);color:#111!important;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:1.1em;padding:.7em .85em;margin-bottom:.4em;color:var(--fg);text-align:left;width:100%}
.ncard .ai{flex:none;width:1.7em;height:1.7em;border-radius:.5em;overflow:hidden}
.ncard .ai svg{width:100%;height:100%;display:block}
.ncard .nb{flex:1;min-width:0}
.ncard .nt{display:flex;justify-content:space-between;gap:.5em;font-size:.72em;color:var(--fg2)}
.ncard .nn{font-size:.86em;font-weight:700;margin-top:.1em;display:flex;align-items:center;gap:.4em}
.ncard .nx{font-size:.8em;color:#333;margin-top:.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{display:inline-grid;place-items:center;min-width:1.45em;height:1.45em;padding:0 .4em;border-radius:999px;background:var(--red);color:#fff;font-size:.68em;font-weight:700;font-variant-numeric:tabular-nums}
.groups{display:flex;flex-direction:column;margin-top:1.1em;min-height:0}
.groups .ncard{cursor:pointer}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(.9em)}}
.more{align-self:center;font-size:.74em;font-weight:500;padding:.45em 1em;border-radius:999px;color:#111;background:rgba(245,245,247,.75);backdrop-filter:blur(10px);margin-top:.2em}
.lfoot{margin-top:auto;text-align:center;font-size:.76em;color:rgba(255,255,255,.8);display:flex;flex-direction:column;align-items:center;gap:.35em;padding-top:.6em;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.lfoot svg{width:1.4em;height:1.4em;stroke:currentColor;fill:none;stroke-width:1.8}
.breathe{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}

.ilock{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:2em;padding:3em calc(var(--gx) * 1.6) 1.4em;cursor:pointer}
.ilock .lhead{align-items:flex-start;text-align:left}
.ilock .lclock{font-size:4.6em}
.ilock .lfoot{position:absolute;left:0;right:0;bottom:1.2em}
.ilock{padding-bottom:4em}
.ilock .groups{overflow:hidden;margin-top:0}
.rig.portrait .ilock .groups{margin-top:1.2em}
.rig.portrait .ilock{grid-template-columns:1fr;grid-template-rows:auto 1fr;gap:0;padding:3em var(--gx) 4em}
.rig.portrait .ilock .lhead{align-items:center;text-align:center}
.rig.portrait .ilock .lclock{font-size:4em}

/* PIN */
.pin{color:#fff;position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1em;padding:2.6em var(--gx) 1.6em;background:rgba(8,9,12,.55);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.pin .pt{font-size:1em;font-weight:500}
.dots{display:flex;gap:.9em;height:1em;align-items:center}
.dots i{width:.72em;height:.72em;border-radius:50%;border:1.5px solid rgba(255,255,255,.8);transition:background .12s,transform .12s}
.dots i.on{background:#fff;transform:scale(1.05)}
.dots.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-.6em)}40%{transform:translateX(.55em)}60%{transform:translateX(-.35em)}80%{transform:translateX(.2em)}}
.pmsg{font-size:.78em;min-height:1.3em;color:#ffb3b5;text-align:center}
.phint{font-size:.76em;color:var(--fg2);min-height:1.2em;text-align:center}
.keys{display:grid;grid-template-columns:repeat(3,4.2em);gap:.55em 1.6em;margin-top:.4em}
.keys button{height:3.2em;border-radius:50%;font-size:1.25em;font-weight:400;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.keys button:active{background:rgba(255,255,255,.12)}
.keys .sm{font-size:.82em}
.rig:not(.portrait) .pin .keys{grid-template-columns:repeat(3,3.6em);gap:.3em 1.4em}
.rig:not(.portrait) .pin .keys button{height:2.6em}

/* home */
.home{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:2.4em var(--gx) 1.6em;color:#fff}
.wid{display:flex;flex-direction:column;align-items:flex-start;padding:.4em .2em;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.wid .wt{font-size:3.2em;font-weight:300;line-height:1;font-variant-numeric:tabular-nums}
.wid .wd{font-size:.86em;font-weight:500;margin-top:.4em}
.wrow{display:flex;align-items:center;gap:.5em;margin-top:.5em;font-size:.86em}
.wico{position:relative;width:2.2em;height:2.2em;flex:none}
.wico svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.wico .sun{opacity:0}
.wico.clear .sun{opacity:1}
.wico.clear .cloud{opacity:0}
.wico.anim .cloud{animation:cloudaway 1.8s ease-in both}
.wico.anim .sun{animation:sunup 2s .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes cloudaway{0%{opacity:1;transform:none}100%{opacity:0;transform:translateX(190%) translateY(-10%)}}
@keyframes sunup{0%{opacity:0;transform:translateY(55%) rotate(-140deg) scale(.6)}60%{opacity:1}100%{opacity:1;transform:none}}
.wlabel{display:inline-block}
.wlabel.swap{animation:fadein .8s 1s both}
.grid{margin-top:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:1.1em .6em;width:100%;max-width:26em;align-self:center;padding-bottom:.6em}
.app-i{display:flex;flex-direction:column;align-items:center;gap:.4em;position:relative}
.app-i .ico{width:3.1em;height:3.1em;border-radius:1em;overflow:hidden;box-shadow:0 4px 12px -4px rgba(0,0,0,.5);position:relative}
.app-i .ico svg{width:100%;height:100%;display:block}
.app-i .lb{font-size:.74em;font-weight:700;color:#fff;text-shadow:0 0 4px rgba(255,255,255,.35),0 1px 3px rgba(0,0,0,.65);white-space:nowrap}
.app-i .cnt{position:absolute;top:-.3em;left:50%;margin-left:1.05em;font-size:.66em;box-shadow:0 0 0 .14em rgba(0,0,0,.25)}
.app-i:active .ico{transform:scale(.94)}
.rig:not(.portrait) .home{display:grid;grid-template-columns:1fr 1.15fr;grid-template-rows:auto 1fr;column-gap:2em}
.rig:not(.portrait) .home .wid{grid-column:1;grid-row:1}
.rig:not(.portrait) .home .grid{grid-column:1/3;grid-row:2;align-self:end;justify-self:center}

/* app shell */
.appl{position:absolute;inset:0;z-index:4;background:var(--scr);display:flex;flex-direction:column;padding:1.6em 0 .4em;color:var(--fg)}
.appl.enter{animation:appin .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes appin{from{opacity:0;transform:scale(.94)}}
.slide{animation:slidein .24s cubic-bezier(.2,.8,.2,1) both}
@keyframes slidein{from{opacity:0;transform:translateX(1.4em)}}
.ah{display:flex;align-items:center;gap:.5em;padding:.6em var(--gx) .5em;min-height:3.2em;flex:none}
.ah h1{font-size:1.25em;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ah .big{font-size:1.65em}
.ah .sub{font-size:.72em;color:var(--fg2);font-weight:400;margin-left:.3em}
.ib{width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;flex:none}
.ib:active{background:var(--surf3)}
.ib svg{width:1.15em;height:1.15em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tb{font-size:.86em;font-weight:500;color:var(--fg);padding:.3em .5em}
.scroll{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#3a3d43 transparent}
.split{flex:1;min-height:0;display:flex}
.split>.pane{min-width:0;display:flex;flex-direction:column}
.split>.pane.l{width:38%;flex:none;border-right:1px solid var(--line)}
.split>.pane.r{flex:1}
.empty{flex:1;display:grid;place-items:center;color:var(--fg3);font-size:.86em;text-align:center;padding:var(--gx)}
.av{flex:none;width:2.6em;height:2.6em;border-radius:38%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:.9em;background-size:cover;background-position:center;overflow:hidden}
.av.round{border-radius:50%}
.row{display:flex;align-items:center;gap:.8em;padding:.62em var(--gx);width:100%;text-align:left;cursor:pointer}
.row:active,.row.sel{background:var(--surf2)}
.row .rb{flex:1;min-width:0}
.row .rn{font-size:.92em;font-weight:600;display:flex;align-items:center;gap:.35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rn small{font-weight:400;color:var(--fg3);font-size:.85em}
.row .rp{font-size:.8em;color:var(--fg2);margin-top:.15em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rr{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:.3em;font-size:.7em;color:var(--fg3)}
.row .rr .cnt{font-size:1em}
.chk{flex:none;width:1.25em;height:1.25em;border-radius:50%;border:1.5px solid var(--fg3);display:grid;place-items:center}
.chk.on{background:var(--blue);border-color:var(--blue)}
.chk.on::after{content:"";width:.35em;height:.6em;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-.05em,-.08em)}
.toast{position:absolute;left:50%;bottom:2.4em;transform:translateX(-50%);z-index:90;background:rgba(40,40,44,.92);color:#fff;font-size:.8em;padding:.6em 1.1em;border-radius:999px;white-space:nowrap;animation:toast 2.2s both;pointer-events:none}
@keyframes toast{0%{opacity:0;transform:translate(-50%,.6em)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}
.modal{position:absolute;inset:0;z-index:85;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:1em;animation:fadein .2s}
.dlg{width:100%;max-width:22em;background:#fff;border-radius:1.4em;padding:1.3em 1.3em .7em;margin-bottom:1em;animation:rise .25s both}
.dlg p{margin:0 0 1em;font-size:.9em;line-height:1.5}
.dlg .acts{display:flex}
.dlg .acts button{flex:1;padding:.7em;font-size:.88em;font-weight:600;border-radius:.8em}
.dlg .acts .danger{color:var(--red)}
.banner{position:absolute;left:.5em;right:.5em;top:.4em;z-index:80;display:flex;gap:.65em;align-items:center;background:rgba(246,246,248,.97);color:#111;border-radius:1.2em;padding:.7em .9em;box-shadow:0 10px 30px -8px rgba(0,0,0,.6);cursor:pointer;animation:bannerin .38s cubic-bezier(.2,.8,.2,1) both;max-width:30em;margin:0 auto}
.banner.out{animation:bannerout .3s ease-in both}
@keyframes bannerin{from{transform:translateY(-130%)}}
@keyframes bannerout{to{transform:translateY(-130%);opacity:0}}
.banner .ai{flex:none;width:1.9em;height:1.9em;border-radius:.55em;overflow:hidden}
.banner .ai svg{width:100%;height:100%;display:block}
.banner .bb{flex:1;min-width:0}
.banner .bn{font-size:.84em;font-weight:700}
.banner .bx{font-size:.8em;color:#333;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.banner .btm{font-size:.68em;color:var(--fg3);align-self:flex-start}

/* messages (sms) */
.thread{padding:.4em var(--gx) 1em;display:flex;flex-direction:column}
.dd{align-self:center;font-size:.7em;color:var(--fg3);margin:1.1em 0 .5em;padding:.25em .8em;border-radius:999px;background:var(--surf)}
.sm{display:flex;align-items:flex-end;gap:.4em;margin-top:.22em;max-width:100%}
.sm.gap{margin-top:.9em}
.sm.me{flex-direction:row-reverse;align-self:flex-end}
.sm .bub{max-width:72%;padding:.55em .85em;border-radius:1.15em;font-size:.88em;line-height:1.45;white-space:pre-wrap;word-break:break-word;background:#e9e9eb;color:#111;cursor:pointer}
.sm.me .bub{background:var(--blue);color:#fff}
.sm .tm{font-size:.62em;color:var(--fg3);flex:none;white-space:nowrap}
.sm.new .bub{animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(.4em)}}
.pop{position:absolute;z-index:70;background:var(--surf3);border-radius:.8em;padding:.2em;box-shadow:0 8px 24px -6px rgba(0,0,0,.6);animation:fadein .15s}
.pop button{display:block;padding:.55em 1.2em;font-size:.82em;color:var(--red)}
.ebar{flex:none;display:flex;justify-content:center;padding:.6em;border-top:1px solid var(--line)}
.ebar button{color:var(--red);font-weight:600;font-size:.86em;padding:.4em 1.4em}
.ebar button:disabled{opacity:.4}
.sinput{flex:none;display:flex;align-items:center;gap:.5em;padding:.5em var(--gx) .6em}
.sinput .fld{flex:1;min-width:0;background:var(--surf2);border-radius:999px;padding:.6em 1em;font-size:.82em;color:var(--fg3)}

/* kakao */
.appl.kk{background:linear-gradient(var(--sky) 0 50%,var(--surf) 50%)}
.kk .scroll{background:var(--sky)}
.kk{background:var(--sky)}
.kk .ah{background:var(--sky);color:#111}
.kthread{padding:.3em var(--gx) 1em;display:flex;flex-direction:column}
.kthread .dd{background:rgba(0,0,0,.12);color:#fff}
.km{display:flex;gap:.45em;margin-top:.22em;align-items:flex-start}
.km.first{margin-top:.85em}
.kav{flex:none;width:2.3em}
.kav .av{width:2.3em;height:2.3em;font-size:.82em}
.kcol{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start}
.kname{font-size:.72em;color:#4a5560;margin:0 0 .25em .1em}
.kline{display:flex;align-items:flex-end;gap:.35em;max-width:100%}
.kb{max-width:16.5em;padding:.5em .75em;border-radius:.95em;font-size:.86em;line-height:1.45;background:#fff;color:#1a1a1a;white-space:pre-wrap;word-break:break-word;min-width:0}
.km.first:not(.me) .kb{border-top-left-radius:.3em}
.kt{font-size:.6em;color:#55606b;flex:none;white-space:nowrap}
.km.me{justify-content:flex-end}
.km.me .kcol{align-items:flex-end}
.km.me .kline{flex-direction:row-reverse}
.km.me .kb{background:var(--kakao);color:#191600}
.km.me.first .kb{border-top-right-radius:.3em}
.kb.del{background:rgba(255,255,255,.75);color:#666;display:flex;align-items:center;gap:.35em}
.km.me .kb.del{background:rgba(254,229,0,.6)}
.kb.del svg{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2}
.react{margin-top:.25em;font-size:.66em;background:rgba(255,255,255,.92);color:#333;border-radius:999px;padding:.12em .55em;display:inline-flex;align-items:center;gap:.25em;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.react svg{width:1em;height:1em}
.km.new .kb,.km.new .locb{animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both}
.typing .kb{display:flex;gap:.25em;padding:.7em .8em}
.typing .kb i{width:.38em;height:.38em;border-radius:50%;background:#9aa0a8;animation:tdot 1s infinite}
.typing .kb i:nth-child(2){animation-delay:.15s}.typing .kb i:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-.2em)}}
.locb{width:13em;max-width:100%;border-radius:.95em;overflow:hidden;background:#fff;color:#1a1a1a}
.locb .lm{height:6.2em;display:block;width:100%}
.locb .li{padding:.55em .75em .65em}
.locb .li b{display:block;font-size:.82em}
.locb .li span{display:block;font-size:.72em;color:#666;margin-top:.15em}
.kin{flex:none;background:var(--surf);padding:.5em .7em .6em}
.kin .bar{display:flex;align-items:center;gap:.45em}
.kin .fld{flex:1;min-width:0;background:var(--surf2);border-radius:999px;padding:.6em 1em;font-size:.82em;color:var(--fg3)}
.plusb{width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surf2);transition:transform .2s}
.plusb svg{width:1.05em;height:1.05em;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.plusb.open{transform:rotate(45deg)}
.plusb.glow{animation:glow 1s ease-in-out infinite;color:var(--kakao-ink)}
@keyframes glow{0%,100%{background:var(--kakao);box-shadow:0 0 0 0 rgba(254,229,0,.6)}50%{background:#fff27a;box-shadow:0 0 0 .45em rgba(254,229,0,0)}}
.pmenu{display:grid;grid-template-columns:repeat(3,1fr);gap:.6em;padding:.9em .4em .3em;animation:rise .2s both}
.pmenu button{display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:.72em;color:var(--fg2)}
.pmenu .pc{width:3.2em;height:3.2em;border-radius:50%;display:grid;place-items:center}
.pmenu .pc svg{width:1.4em;height:1.4em;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pmenu .glowi .pc{animation:glow 1s ease-in-out infinite}
.pmenu .glowi .pc svg{stroke:var(--kakao-ink)}
.choices{display:flex;flex-direction:column;gap:.45em;padding:.2em 0}
.choices button{background:var(--surf2);border:1px solid #3d4048;border-radius:.9em;padding:.7em 1em;font-size:.84em;text-align:left;animation:rise .3s both}
.choices button:nth-child(2){animation-delay:.08s}
.choices button:active{background:var(--surf3)}
.krow .av{border-radius:38%}
.av.grpav{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;place-items:stretch;gap:1px;background:var(--surf);padding:0}
.grpav i{display:block}
.grpav i{background:#7a8496}
.grpav i:nth-child(2){background:#9a7a96}.grpav i:nth-child(3){background:#7a9a86}.grpav i:nth-child(4){background:#9a927a}
.kbadge{background:#ff5a36}

/* phone */
.cl-d{font-size:.72em;color:var(--fg3);padding:1em var(--gx) .3em;font-weight:500}
.callrow .rn.miss{color:var(--red)}
.callrow .rp{display:flex;align-items:center;gap:.3em}
.callrow .rp svg{width:1em;height:1em;flex:none}
.callbtn{width:2.3em;height:2.3em;border-radius:50%;background:var(--green);display:grid;place-items:center;flex:none}
.callbtn svg{width:1.05em;height:1.05em;fill:#fff}
.dur{font-size:.7em;color:var(--fg3);font-variant-numeric:tabular-nums;white-space:nowrap}
.tabs{flex:none;display:flex;justify-content:space-around;padding:.5em var(--gx) .3em;border-top:1px solid var(--line)}
.tabs span{font-size:.78em;color:var(--fg3);padding:.3em .6em}
.tabs span.on{color:var(--fg);font-weight:700}

/* call overlay */
.call{color:#fff;position:absolute;inset:0;z-index:75;display:flex;flex-direction:column;align-items:center;padding:3.4em var(--gx) 3.6em;background:linear-gradient(180deg,#1b2233,#121522 55%,#0c0d12);cursor:default;overflow:hidden}
.call.enter{animation:fadein .3s}
.call .cs{font-size:.8em;color:#b9bcc4}
.call .cn{font-size:1.8em;font-weight:500;margin-top:.25em}
.call .cnum{font-size:.82em;color:#b9bcc4;margin-top:.3em;font-variant-numeric:tabular-nums}
.pulse{position:relative;width:6em;height:6em;margin:2.4em 0 auto;display:grid;place-items:center}
.pulse .av{width:3em;height:3em;font-size:2em;border-radius:50%;position:relative;z-index:2}
.pulse i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(140,170,255,.5);animation:ripple 2s ease-out infinite}
.pulse i:nth-child(2){animation-delay:.66s}.pulse i:nth-child(3){animation-delay:1.33s}
@keyframes ripple{from{transform:scale(1);opacity:.9}to{transform:scale(2.1);opacity:0}}
.cbtns{display:flex;gap:5em;justify-content:center}
.cbtn{width:3.6em;height:3.6em;border-radius:50%;display:grid;place-items:center;transition:opacity .3s,filter .3s}
.cbtn svg{width:1.5em;height:1.5em;fill:#fff}
.cbtn.ok{background:var(--green);animation:nudge 1.4s ease-in-out infinite}
.cbtn.no{background:var(--red)}
.cbtn.no svg{transform:rotate(135deg)}
.cbtn.dim{opacity:.32;filter:saturate(.4);cursor:default}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-.25em)}}
.ctimer{font-size:.9em;color:#b9bcc4;margin-top:.35em;font-variant-numeric:tabular-nums}
.line{flex:1;width:100%;max-width:24em;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:.6em;cursor:pointer;padding:1em 0;min-height:0}
.line .who{font-size:.72em;color:#8a8e98;letter-spacing:.06em}
.line .say{font-size:1.15em;line-height:1.6;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.line .say.me{color:#b9cdfc}
.line .say.show{animation:say .45s ease both}
@keyframes say{from{opacity:0;transform:translateY(.4em)}}
.line .tap{font-size:.7em;color:#8a8e98;margin-top:.6em}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:.9em 1.6em;margin-bottom:1.6em;opacity:.75}
.cgrid span{display:flex;flex-direction:column;align-items:center;gap:.3em;font-size:.66em;color:#b9bcc4}
.cgrid svg{width:1.8em;height:1.8em;stroke:currentColor;fill:none;stroke-width:1.7}
.rig:not(.portrait) .cgrid{display:none}
.tear{position:absolute;z-index:5;width:1.05em;height:1.35em;left:58%;top:-2em;pointer-events:none;border-radius:50% 50% 50% 50%/62% 62% 40% 40%;background:radial-gradient(circle at 38% 62%,rgba(255,255,255,.85),rgba(255,255,255,0) 22%),radial-gradient(circle at 50% 60%,rgba(200,220,255,.28),rgba(170,200,255,.12) 60%,rgba(255,255,255,.35) 100%);box-shadow:inset 0 -.12em .2em rgba(255,255,255,.3),inset 0 .1em .25em rgba(0,0,30,.35),0 .1em .3em rgba(0,0,0,.25);backdrop-filter:blur(1.5px) brightness(1.15);-webkit-backdrop-filter:blur(1.5px) brightness(1.15)}
.trail{position:absolute;z-index:4;width:.5em;left:calc(58% + .28em);pointer-events:none;border-radius:999px;background:linear-gradient(180deg,rgba(200,220,255,.0),rgba(200,220,255,.18) 20%,rgba(220,235,255,.12));backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px);transform-origin:top}

/* gallery */
.gm{font-size:.86em;font-weight:700;padding:1em var(--gx) .5em}
.gg{display:grid;grid-template-columns:repeat(4,1fr);gap:.3em;padding:0 var(--gx)}
.rig:not(.portrait) .gg{grid-template-columns:repeat(7,1fr)}
.gt{aspect-ratio:1;border-radius:.6em;overflow:hidden;position:relative;cursor:pointer;max-width:100%}
.gt img{width:100%;height:100%;object-fit:cover;display:block}
.phimg{width:100%;height:100%;display:flex;align-items:flex-end;padding:.35em;font-size:.58em;color:rgba(255,255,255,.75);line-height:1.2}
.phimg svg{position:absolute;left:50%;top:42%;width:1.9em;height:1.9em;transform:translate(-50%,-50%);stroke:rgba(255,255,255,.55);fill:none;stroke-width:1.5}
.viewer{position:absolute;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;animation:fadein .2s}
.viewer .vh{display:flex;align-items:center;gap:.5em;padding:2.2em var(--gx) .3em}
.viewer .vimg{flex:1;min-height:0;position:relative;display:grid;place-items:center}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vimg .phimg{position:absolute;inset:1em;width:auto;height:auto;border-radius:.4em;font-size:1em;justify-content:center;align-items:center}
.viewer .vimg .phimg svg{width:3em;height:3em;top:40%}
.vnav{position:absolute;top:50%;transform:translateY(-50%);width:2.4em;height:2.4em;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;z-index:3}
.vnav svg{width:1.1em;height:1.1em;stroke:#fff;fill:none;stroke-width:2.2}
.vnav.p{left:.6em}.vnav.n{right:.6em}
.vinfo{padding:.8em var(--gx) 3.2em}
.vinfo b{display:block;font-size:.95em}
.vinfo span{display:block;font-size:.76em;color:var(--fg2);margin-top:.2em}

/* memo */
.mcards{display:grid;grid-template-columns:1fr;gap:.6em;padding:.3em var(--gx) 1em}
.mcard{background:var(--surf);border-radius:1em;padding:.85em 1em;text-align:left;width:100%;cursor:pointer}
.mcard.sel{outline:1.5px solid #e9a23b}
.mcard b{display:block;font-size:.9em}
.mcard p{margin:.3em 0 0;font-size:.78em;color:var(--fg2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.mcard span{display:block;font-size:.68em;color:var(--fg3);margin-top:.4em}
.mbody{padding:.2em var(--gx) 1.4em}
.mbody h2{font-size:1.3em;margin:.2em 0 .2em}
.mbody .md{font-size:.72em;color:var(--fg3);margin-bottom:1em}
.mbody .mt{font-size:.9em;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.ci{display:flex;align-items:center;gap:.7em;padding:.5em 0;font-size:.9em;cursor:pointer;width:100%;text-align:left}
.ci.done span{color:var(--fg3);text-decoration:line-through}
.ci .chk{border-radius:.3em}
.ci .chk.on{background:#e9a23b;border-color:#e9a23b}

/* map */
.mapv{position:relative;flex:1;min-height:0;overflow:hidden;background:#eef0ec;touch-action:none;cursor:grab}
.mapv.drag{cursor:grabbing}
.world{position:absolute;left:0;top:0;will-change:transform}
.world.ease{transition:transform .6s cubic-bezier(.3,.8,.25,1)}
.world svg.base{display:block}
.mpin{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:2}
.mpin .pk{width:1.9em;height:1.9em;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#ff6b4a;display:grid;place-items:center;box-shadow:0 3px 8px rgba(0,0,0,.45);border:2px solid #fff}
.mpin .pk svg{transform:rotate(45deg);width:.9em;height:.9em;fill:#fff}
.mpin .pl{margin-top:.25em;font-size:.66em;font-weight:700;color:#111;background:rgba(255,255,255,.9);padding:.1em .45em;border-radius:.4em;white-space:nowrap}
.mpin.on .pk{background:var(--naver);transform:rotate(-45deg) scale(1.15)}
.here{position:absolute;width:1.1em;height:1.1em;transform:translate(-50%,-50%);border-radius:50%;background:var(--naver);border:2.5px solid #fff;box-shadow:0 0 0 0 rgba(25,196,99,.5);animation:herep 2s infinite;z-index:3}
@keyframes herep{0%{box-shadow:0 0 0 0 rgba(25,196,99,.55)}100%{box-shadow:0 0 0 1.4em rgba(25,196,99,0)}}
.mtop{position:absolute;left:0;right:0;top:0;z-index:5;padding:.5em var(--gx) 0;display:flex;flex-direction:column;gap:.5em;pointer-events:none}
.msearch{pointer-events:auto;display:flex;align-items:center;gap:.6em;background:#fff;border-radius:999px;padding:.65em 1em;font-size:.84em;color:var(--fg3);box-shadow:0 4px 14px -4px rgba(0,0,0,.6)}
.msearch svg{width:1.1em;height:1.1em;stroke:var(--naver);fill:none;stroke-width:2.4}
.chips{display:flex;gap:.35em;overflow:hidden;pointer-events:auto}
.chips span{flex:none;font-size:.7em;padding:.4em .75em;border-radius:999px;background:#fff;color:var(--fg);box-shadow:0 2px 6px rgba(0,0,0,.35);white-space:nowrap}
.mfab{position:absolute;z-index:5;width:2.5em;height:2.5em;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.5)}
.mfab svg{width:1.15em;height:1.15em;stroke:var(--fg);fill:none;stroke-width:2}
.mfab.loc{right:var(--gx);bottom:.8em}
.mfab.loc svg{stroke:var(--naver)}
.mfab.bm{left:var(--gx);bottom:.8em}
.mfab.bm.on{background:var(--naver)}
.mfab.bm.on svg{stroke:#fff}
.mpop{position:absolute;left:var(--gx);bottom:3.7em;z-index:6;width:min(15em,calc(100% - 2 * var(--gx)));background:#fff;border-radius:1em;padding:.4em;box-shadow:0 10px 26px -6px rgba(0,0,0,.65);animation:rise .2s both}
.mpop .mh{font-size:.7em;color:var(--fg3);padding:.35em .6em}
.mpop button{display:flex;align-items:center;gap:.55em;width:100%;padding:.5em .6em;border-radius:.6em;text-align:left}
.mpop button:active{background:var(--surf3)}
.mpop button svg{width:.95em;height:.95em;fill:var(--naver);flex:none}
.mpop button b{font-size:.8em;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpop button span{display:block;font-size:.68em;color:var(--fg3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpop button div{min-width:0}
.mcardx{position:absolute;left:var(--gx);right:var(--gx);bottom:4em;z-index:6;display:flex;align-items:center;gap:.6em;background:var(--surf2);border-radius:999px;padding:.45em .5em .45em 1em;box-shadow:0 8px 22px -6px rgba(0,0,0,.35);animation:rise .25s both;max-width:30em;margin:0 auto;background:#fff}
.mcardx .mi{flex:1;min-width:0;font-size:.78em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcardx .mi b{font-weight:700}
.mcardx .mi span{color:var(--fg3);margin-left:.4em}
.mcardx .mb{flex:none;font-size:.7em;font-weight:600;padding:.4em .7em;border-radius:999px;background:var(--surf3)}
.mcardx .mb.go{background:var(--naver);color:#fff}
.mcardx .ib{width:1.8em;height:1.8em}
.mtabs{flex:none;display:flex;justify-content:space-around;padding:.45em .4em .3em;background:var(--surf);border-top:1px solid var(--line)}
.mtabs span{display:flex;flex-direction:column;align-items:center;gap:.15em;font-size:.62em;color:var(--fg3)}
.mtabs span.on{color:var(--naver);font-weight:700}
.mtabs svg{width:1.7em;height:1.7em;stroke:currentColor;fill:none;stroke-width:1.8}

/* naver */
.nv{background:#fff}
.nlogo{display:flex;align-items:center;justify-content:center;padding:1.1em 0 .7em}
.nlogo b{font-size:1.5em;font-weight:900;letter-spacing:-.04em;color:var(--naver)}
.nsearch{margin:0 var(--gx);display:flex;align-items:center;gap:.6em;border:2px solid var(--naver);border-radius:999px;padding:.6em 1em;font-size:.86em;color:var(--fg3);cursor:text;background:#fff}
.nsearch svg{width:1.15em;height:1.15em;stroke:var(--naver);fill:none;stroke-width:2.4;flex:none}
.nsearch .nf{flex:1;min-width:0}
.nshort{display:grid;grid-template-columns:repeat(4,1fr);gap:.9em .3em;padding:1.3em var(--gx) .6em}
.nshort span{display:flex;flex-direction:column;align-items:center;gap:.35em;font-size:.68em;color:var(--fg2)}
.nshort i{width:2.6em;height:2.6em;border-radius:.9em;background:var(--surf2);display:grid;place-items:center}
.nshort i svg{width:1.3em;height:1.3em;stroke:var(--naver);fill:none;stroke-width:1.9}
.ncardw{margin:.6em var(--gx);background:var(--surf);border-radius:1em;padding:.9em 1em}
.ncardw h3{margin:0 0 .6em;font-size:.82em;font-weight:700}
.nwx{display:flex;align-items:center;gap:.8em}
.nwx .wico{width:2.8em;height:2.8em}
.nwx b{font-size:1.6em;font-weight:500;font-variant-numeric:tabular-nums}
.nwx span{font-size:.78em;color:var(--fg2)}
.nwx .wsub{display:flex;flex-direction:column;gap:.1em}
.news{list-style:none;margin:0;padding:0}
.news li{font-size:.82em;padding:.5em 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0}
.rhead{display:flex;justify-content:space-between;align-items:center;padding:1em var(--gx) .4em;font-size:.76em;color:var(--fg3)}
.rhead button{font-size:1em;color:var(--fg2)}
.rrow{display:flex;align-items:center;gap:.7em;padding:.55em var(--gx)}
.rrow svg.clk{width:1em;height:1em;stroke:var(--fg3);fill:none;stroke-width:2;flex:none}
.rrow span{flex:1;min-width:0;font-size:.86em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rrow .ib{width:1.8em;height:1.8em}
.rrow .ib svg{width:.85em;height:.85em}
.nsbar{display:flex;align-items:center;gap:.4em;padding:.6em var(--gx) .5em}
.nsbar .nsearch{margin:0;flex:1}

/* calendar */
.calw{flex:1;min-height:0;display:flex}
.rig.portrait .calw{flex-direction:column}
.calm{flex:1.4;min-width:0;display:flex;flex-direction:column;padding:0 var(--gx)}
.rig.portrait .calm{flex:none}
.calhead{display:flex;align-items:center;gap:.4em;padding:.2em 0 .5em}
.calhead h2{flex:1;margin:0;font-size:1.15em;font-weight:700;font-variant-numeric:tabular-nums}
.calhead .tb{border:1px solid var(--line);border-radius:999px;font-size:.72em;padding:.3em .8em}
.dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:.66em;color:var(--fg3);text-align:center;padding-bottom:.3em}
.dow span:first-child{color:var(--red)}.dow span:last-child{color:#6aa5ff}
.weeks{flex:1;display:flex;flex-direction:column;min-height:0}
.wk{flex:1;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:min-content;border-top:1px solid var(--line);min-height:2.9em;align-content:start;row-gap:.12em;padding-bottom:.2em}
.rig.portrait .wk{min-height:2.75em;flex:none}
.dc{grid-row:1;display:flex;justify-content:center;padding-top:.25em;cursor:pointer}
.dc span{width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;font-size:.74em;font-variant-numeric:tabular-nums}
.dc.sun span,.dc.hol span{color:var(--red)}
.dc.sat span{color:#6aa5ff}
.dc.hol span{color:var(--red)}
.dc.out span{opacity:.35}
.dc.today span{background:var(--blue);color:#fff;font-weight:700}
.dc.sel:not(.today) span{box-shadow:inset 0 0 0 1.5px var(--fg2)}
.evb{font-size:.56em;line-height:1.5;padding:0 .4em;border-radius:.35em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:0 .15em;min-width:0;cursor:pointer}
.evb.cont-l{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.evb.cont-r{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.evb.single{background:transparent!important;color:var(--fg2);padding-left:.2em}
.evb.single i{display:inline-block;width:.5em;height:.5em;border-radius:50%;margin-right:.25em;vertical-align:.05em}
.cald{flex:1;min-width:0;border-left:1px solid var(--line);display:flex;flex-direction:column}
.rig.portrait .cald{border-left:0;border-top:1px solid var(--line);margin-top:.4em}
.cald h3{margin:0;padding:.7em var(--gx) .4em;font-size:.86em;font-weight:700}
.cald h3 small{color:var(--red);font-weight:500;margin-left:.4em}
.evr{display:flex;gap:.7em;padding:.55em var(--gx);align-items:flex-start}
.evr i{width:.3em;align-self:stretch;border-radius:.2em;flex:none}
.evr b{display:block;font-size:.86em;font-weight:600}
.evr span{display:block;font-size:.72em;color:var(--fg2);margin-top:.15em}
.noev{padding:.6em var(--gx);font-size:.8em;color:var(--fg3)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .vib.buzz{animation:none}
}

/* ── iOS specifics ── */
.app-i .ico{border-radius:22%}
.home .grid{margin-top:1.8em;align-self:center;gap:1.2em .5em}
.home .wid{background:rgba(255,255,255,.18);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:1.2em;padding:.9em 1em;align-self:stretch}
.home .wid .wt{font-size:2.6em}
.lock .lhead{text-align:center;align-items:center}
.lock-ic svg{width:1.1em;height:1.1em;stroke:#fff;fill:none;stroke-width:2}
.lock .ldate{margin-top:.3em;font-size:.95em;font-weight:500}
.lock .lclock{font-size:4.4em;font-weight:500;letter-spacing:-.02em;margin-top:.05em}
.off{position:absolute;inset:0;background:#000;display:grid;place-items:center;z-index:5}
.off span{font-size:.82em;color:rgba(255,255,255,.28);letter-spacing:.06em}
.pin.ios{justify-content:flex-start;padding-top:3.6em;gap:.9em;background:rgba(30,30,34,.45)}
.pin.ios .keys{grid-template-columns:repeat(3,4.1em);gap:.75em 1.3em;margin-top:.9em}
.pin.ios .keys button{width:4.1em;height:4.1em;border-radius:50%;background:rgba(255,255,255,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1em;line-height:1}
.pin.ios .keys button:active{background:rgba(255,255,255,.5)}
.pin.ios .keys b{font-size:1.75em;font-weight:400}
.pin.ios .keys small{font-size:.55em;letter-spacing:.15em;font-weight:600;margin-top:.15em}
.pin.ios .dots i{border-width:1.5px}
.pfoot{width:100%;max-width:16em;display:flex;justify-content:space-between;font-size:.86em;margin-top:auto;padding-bottom:.6em}
.pin.ios .phint{position:absolute;left:0;right:0;bottom:2.6em}
.rsheet{position:absolute;inset:0;z-index:88;background:rgba(0,0,0,.35);display:flex;align-items:flex-start;justify-content:center;padding:3.2em 1em 0;animation:fadein .2s}
.rsheet.out{animation:fadeout .3s both}

<body>
<div class="page">
  <div class="cap" id="cap"></div>
  <div class="stage" id="stage">
    <div class="rig" id="rig">
      <div class="vib" id="vib">
        <div class="body"></div>
        <div class="sensor"></div><div class="fcam"></div><div class="ear"></div>
        <div class="inner" id="inner" role="button" tabindex="0" aria-label="휴대폰 화면"></div>
        <button class="homebtn" id="homeBtn" aria-label="홈 버튼"></button>
      </div>
    </div>
  </div>
  <div class="under"><div class="hint" id="hint" aria-live="polite"></div><button class="closebtn" id="closeBtn" hidden>화면 끄기</button></div>
</div>

<script>
(function () {
'use strict';
const D = DATA, SC = D.script, A = D.A;

/* ───────── helpers ───────── */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const el = html => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = (a, b) => a + Math.random() * (b - a);
const RM = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const reflow = e => void e.offsetWidth;

/* ───────── time ───────── */
const T0 = Date.now();
const [H0, M0] = D.time.split(':').map(Number);
function nowHM() { const m = (H0 * 60 + M0 + Math.floor((Date.now() - T0) / 60000)) % 1440; return pad(Math.floor(m / 60)) + ':' + pad(m % 60); }
function ampm(t) { if (!t) return ''; const [h, m] = t.split(':').map(Number); return (h < 12 ? '오전 ' : '오후 ') + ((h % 12) || 12) + ':' + pad(m); }
function h12(t) { const [h, m] = t.split(':').map(Number); return ((h % 12) || 12) + ':' + pad(m); }
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const TODAY = D.today;
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function fmtMD(s) { const d = pd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${WD[d.getDay()]}요일`; }
function fmtYMD(s) { return pd(s).getFullYear() + '년 ' + fmtMD(s); }
function dayDiff(s) { return Math.round((pd(TODAY) - pd(s)) / 864e5); }
function relDay(s) { const k = dayDiff(s); if (k === 0) return '오늘'; if (k === 1) return '어제'; const d = pd(s); return `${d.getMonth() + 1}월 ${d.getDate()}일`; }
function listStamp(date, t) { return dayDiff(date) === 0 ? ampm(t) : relDay(date); }

/* ───────── icons ───────── */
const sv = (inner, vb = '0 0 24 24') => `<svg viewBox="${vb}" aria-hidden="true">${inner}</svg>`;
const I = {
  back: sv('<path d="M15 5l-7 7 7 7"/>'),
  chevR: sv('<path d="M9 5l7 7-7 7"/>'),
  search: sv('<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'),
  plus: sv('<path d="M12 5v14M5 12h14"/>'),
  close: sv('<path d="M6 6l12 12M18 6L6 18"/>'),
  trash: sv('<path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/>'),
  more: sv('<circle cx="12" cy="5" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="12" cy="19" r="1.3"/>'),
  menu: sv('<path d="M4 7h16M4 12h16M4 17h16"/>'),
  chat: sv('<path d="M4 5h16v11H9l-5 4z"/><path d="M12 8v5M9.5 10.5h5"/>'),
  lock: sv('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  up: sv('<path d="M6 14l6-6 6 6"/>'),
  clock: sv('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),

  cam: sv('<path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/>'),
  pinp: sv('<path d="M12 21s-6.5-6.2-6.5-11a6.5 6.5 0 0 1 13 0c0 4.8-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/>'),
  delmsg: sv('<circle cx="12" cy="12" r="8"/><path d="M12 8v5M12 16v.5"/>'),
  heart: sv('<path fill="#ff4d6a" stroke="none" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>'),
  check: sv('<circle fill="#2fc06f" stroke="none" cx="12" cy="12" r="9"/><path fill="none" stroke="#fff" stroke-width="2.4" d="M7.5 12.3l3 3 6-6.3"/>'),
  phoneF: sv('<path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/>'),
  missed: sv('<path d="M5 7l6 6 5-5M16 8v4M16 8h-4" stroke="#ff5b5f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18h16" stroke="#ff5b5f" stroke-width="2" stroke-linecap="round"/>'),
  incoming: sv('<path d="M17 7L7 17M7 10v7h7" stroke="#4aa3ff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'),
  outgoing: sv('<path d="M7 17L17 7M10 7h7v7" stroke="#2fc06f" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'),
  mute: sv('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>'),
  spk: sv('<path d="M4 9.5h4L13 5v14l-5-4.5H4z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a7.5 7.5 0 0 1 0 11"/>'),
  pad: sv('<circle cx="6" cy="5" r="1.2"/><circle cx="12" cy="5" r="1.2"/><circle cx="18" cy="5" r="1.2"/><circle cx="6" cy="11" r="1.2"/><circle cx="12" cy="11" r="1.2"/><circle cx="18" cy="11" r="1.2"/><circle cx="6" cy="17" r="1.2"/><circle cx="12" cy="17" r="1.2"/><circle cx="18" cy="17" r="1.2"/>'),
  rec: sv('<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>'),
  vid: sv('<rect x="3" y="6.5" width="12.5" height="11" rx="2"/><path d="M15.5 10.5l5-3v9l-5-3z"/>'),
  bt: sv('<path d="M7 7.5l10 9-5 4.5V3l5 4.5-10 9"/>'),
  navRecent: sv('<path d="M6 6.5v11M12 6.5v11M18 6.5v11"/>'),
  navHome: sv('<rect x="6" y="6" width="12" height="12" rx="4"/>'),
  navBack: sv('<path d="M15 5l-7 7 7 7"/>'),
  signal: `<svg viewBox="0 0 20 14"><rect x="0" y="10" width="3" height="4" rx=".6"/><rect x="5" y="7" width="3" height="7" rx=".6"/><rect x="10" y="4" width="3" height="10" rx=".6"/><rect x="15" y="1" width="3" height="13" rx=".6"/></svg>`,
  wifi: `<svg viewBox="0 0 20 14"><path d="M10 13.6l-2.6-3.1a4 4 0 0 1 5.2 0zM4.6 7.4a8.4 8.4 0 0 1 10.8 0l-1.6 1.9a5.9 5.9 0 0 0-7.6 0zM1.6 4a13 13 0 0 1 16.8 0l-1.6 1.9a10.4 10.4 0 0 0-13.6 0z"/></svg>`,
  batt: p => `<svg viewBox="0 0 26 14"><rect x=".7" y="1.2" width="21.6" height="11.6" rx="3" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".6"/><rect x="2.4" y="2.9" width="${Math.max(1.5, 18.2 * p / 100)}" height="8.2" rx="1.6" fill="${p <= 20 ? '#ff5b5f' : 'currentColor'}"/><rect x="23.2" y="4.8" width="1.8" height="4.4" rx=".9" opacity=".6"/></svg>`
};

/* app icons (simple, brand-neutral) */
const ICON = {
  map: `<rect width="100" height="100" fill="#f3f6f4"/><path d="M0 64L38 50 64 60 100 44" stroke="#cfd8d3" stroke-width="7" fill="none"/><path d="M28 0v100M70 0v100" stroke="#dfe6e2" stroke-width="5"/><path d="M50 82s-17-16-17-29a17 17 0 0 1 34 0c0 13-17 29-17 29z" fill="#19c463"/><circle cx="50" cy="52" r="6.5" fill="#fff"/>`,
  naver: `<rect width="100" height="100" fill="#19c463"/><circle cx="45" cy="45" r="17" fill="none" stroke="#fff" stroke-width="8"/><path d="M57 57l14 14" stroke="#fff" stroke-width="9" stroke-linecap="round"/>`,
  memo: `<rect width="100" height="100" fill="#f0a033"/><rect x="27" y="22" width="46" height="58" rx="7" fill="#fff"/><path d="M36 40h28M36 51h28M36 62h18" stroke="#f0a033" stroke-width="5" stroke-linecap="round"/>`,
  gallery: `<rect width="100" height="100" fill="#e9455e"/><g fill="#fff" opacity=".95"><circle cx="50" cy="34" r="12"/><circle cx="66" cy="46" r="12"/><circle cx="60" cy="64" r="12"/><circle cx="40" cy="64" r="12"/><circle cx="34" cy="46" r="12"/></g><circle cx="50" cy="51" r="8" fill="#e9455e"/>`,
  sms: `<rect width="100" height="100" fill="#3e8bff"/><path d="M24 30h52a6 6 0 0 1 6 6v26a6 6 0 0 1-6 6H44l-14 11v-11h-6a6 6 0 0 1-6-6V36a6 6 0 0 1 6-6z" fill="#fff"/><circle cx="38" cy="49" r="4" fill="#3e8bff"/><circle cx="50" cy="49" r="4" fill="#3e8bff"/><circle cx="62" cy="49" r="4" fill="#3e8bff"/>`,
  kakao: `<rect width="100" height="100" fill="#fee500"/><ellipse cx="50" cy="47" rx="29" ry="23" fill="#3b2a1e"/><path d="M33 62l-5 13 15-9z" fill="#3b2a1e"/>`,
  phone: `<rect width="100" height="100" fill="#2fc06f"/><g transform="translate(25 25) scale(2.1)" fill="#fff"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></g>`,
  cal: `<rect width="100" height="100" fill="#4b7cf2"/><rect x="24" y="26" width="52" height="50" rx="8" fill="#fff"/><rect x="24" y="26" width="52" height="13" rx="6" fill="#dfe8ff"/><text x="50" y="68" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-weight="700" font-size="26" fill="#4b7cf2">${pd(TODAY).getDate()}</text>`
};
const ic = k => `<svg viewBox="0 0 100 100" aria-hidden="true">${ICON[k]}</svg>`;
const APPNAME = { map: '지도', naver: '네이버', memo: '메모', gallery: '갤러리', sms: '메시지', kakao: '카카오톡', phone: '전화', cal: '일정' };
const APPS = [['map', '지도'], ['naver', '네이버'], ['memo', '메모'], ['sms', '메시지'], ['kakao', '카카오톡'], ['phone', '전화'], ['cal', '캘린더']];

function wxSVG() {
  let rays = '';
  for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, x1 = 24 + Math.cos(a) * 12, y1 = 24 + Math.sin(a) * 12, x2 = 24 + Math.cos(a) * 16, y2 = 24 + Math.sin(a) * 16; rays += `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"/>`; }
  return `<svg viewBox="0 0 48 48"><g class="sun" style="transform-box:fill-box;transform-origin:center"><circle cx="24" cy="24" r="8" fill="#ffc94a"/><g stroke="#ffc94a" stroke-width="3" stroke-linecap="round">${rays}</g></g><g class="cloud"><path d="M13 35h21a7.5 7.5 0 0 0 .6-15A10.5 10.5 0 0 0 14.4 18 8.6 8.6 0 0 0 13 35z" fill="#cfd5df"/><path d="M19 35h15a6 6 0 0 0 .5-12" fill="none" stroke="#aab2bf" stroke-width="1.4" opacity=".6"/></g></svg>`;
}
const wxLabel = () => S.clear ? D.weather.after : D.weather.before;
const wxSmall = () => `<span class="wico ${S.clear ? 'clear' : ''}" style="width:1.3em;height:1.3em">${wxSVG()}</span>`;

/* ───────── state ───────── */
const S = {
  kakao: clone(D.kakao), sms: clone(D.sms), calls: clone(D.calls), memos: clone(D.memos), recent: clone(D.naver.recent),
  phase: 'off', rig: 'folded', route: { app: null }, sub: {}, wrong: 0, buf: '', pinBusy: false,
  bursted: false, coverExpand: false, afterUnlock: null,
  s1: 'idle', callDone: false, choice: null, locShared: false, noLocSent: false, phase5: false, lastSent: false,
  clear: false, wxPending: false, plusGlow: false, plusOpen: false, typing: null, call: null, timers: {}, scrollBottom: false, newKey: null
};
S.memos.forEach((m, i) => m.id = 'm' + i);

const contact = id => D.contacts[id];
const roomName = r => r.name || (contact(r.who) ? contact(r.who).name : '알 수 없음');
const kUnread = () => S.kakao.reduce((a, r) => a + (r.unread || 0), 0);
const sUnread = () => S.sms.reduce((a, r) => a + (r.unread || 0), 0);
const missedN = () => S.calls.filter(c => c.type === 'missed' && c.unseen).length;
const badgeOf = k => k === 'kakao' ? kUnread() : k === 'sms' ? sUnread() : k === 'phone' ? missedN() : 0;
function hue(str) { let h = 0; for (const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; }
function initial(name) { const s = String(name).replace(/[\[\]()]/g, '').trim(); return esc(Array.from(s)[0] || '?'); }
function avHTML(c, cls = '') {
  if (!c) return `<div class="av ${cls}" style="background:#555">?</div>`;
  if (c.photo) return `<div class="av ${cls}" style="background-image:url('${esc(c.photo)}')"></div>`;
  return `<div class="av ${cls}" style="background:${c.color || `hsl(${hue(c.name)} 35% 45%)`}">${initial(c.name)}</div>`;
}
const pseudo = name => ({ name, color: `hsl(${hue(name)} 32% 46%)` });
function lastInfo(r) { let date = TODAY, last = null; for (const m of r.msgs) { if (m.date) date = m.date; else last = { m, date }; } return last; }
const msgText = m => m.deleted ? '삭제된 메시지입니다.' : m.loc ? '위치를 공유했습니다.' : (m.text || '');
function ensureToday(r) { let d = null; for (const m of r.msgs) if (m.date) d = m.date; if (d !== TODAY) r.msgs.push({ date: TODAY }); }

/* ───────── DOM refs ───────── */
const rig = $('#rig'), vib = $('#vib'), inner = $('#inner'), stage = $('#stage'), homeBtn = $('#homeBtn');
const hintEl = $('#hint'), closeBtn = $('#closeBtn');
document.title = D.pageTitle; $('#cap').textContent = D.pageTitle;
rig.classList.add('portrait');

function sbHTML() { return `<div class="sb"><span class="l">${I.signal}<span>SKT</span>${I.wifi}</span><span data-clock="ampm"></span><span class="r ic"><span>${D.battery}%</span>${I.batt(D.battery)}</span></div>`; }
inner.innerHTML = `<div class="wall" id="iwall" style="--wallc:${esc(D.wallpaperColor || '#8e8e93')}"><div class="wnew ph">[최종 잠금화면 사진]</div></div><div class="view" id="iview"></div>` + sbHTML();
/* 잠금화면 사진 찾기: DATA.finalWallpaper → 같은 폴더의 lock.jpg / lock.jpeg / lock.png … */
(function findFinalWall() {
  const list = [D.finalWallpaper, 'lock.jpg', 'lock.jpeg', 'lock.png', 'lock.JPG', 'lock.JPEG', 'lock.PNG', 'lock.webp', 'lock.heic'].filter(Boolean);
  const tryAt = i => {
    if (i >= list.length) return;
    const im = new Image();
    im.onload = () => { const w = $('.wnew', $('#iwall')); w.classList.remove('ph'); w.textContent = ''; w.style.backgroundImage = `url('${list[i].replace(/'/g, "%27")}')`; };
    im.onerror = () => tryAt(i + 1);
    im.src = list[i];
  };
  tryAt(0);
})();
const view = $('#iview'), wall = $('#iwall');

function tick() { const t = nowHM(); $$('[data-clock]').forEach(e => { e.textContent = e.dataset.clock === 'ampm' ? ampm(t) : h12(t); }); }
setInterval(tick, 5000);

/* ───────── geometry (iPhone 8: body 67.3×138.4mm, screen 16:9) ───────── */
const G = {};
function geom() {
  const vw = document.documentElement.clientWidth, vh = window.innerHeight;
  let H = Math.min(vh - 150, 820), W = H * 0.486;
  if (W > vw - 32) { W = vw - 32; H = W / 0.486; }
  H = Math.max(H, 380); W = H * 0.486;
  const sw = W * 0.885, sh = sw * 16 / 9, top = (H - sh) / 2;
  Object.assign(G, { W, H, sw, sh, top, bot: H - top - sh, sx: (W - sw) / 2 });
}
function applyRig() {
  Object.assign(rig.style, { width: G.W + 'px', height: G.H + 'px', marginLeft: -G.W / 2 + 'px', marginTop: -G.H / 2 + 'px' });
  const set = (k, v) => rig.style.setProperty(k, v + 'px');
  set('--bw', G.W); set('--top', G.top); set('--bot', G.bot); set('--sx', G.sx); set('--sw', G.sw); set('--sh', G.sh);
  set('--hb', G.bot * 0.62); set('--fs', Math.min(15, G.sw / 24));
  stage.style.height = G.H + 'px';
}
window.addEventListener('resize', () => { geom(); applyRig(); });

/* ───────── page hint / close button ───────── */
function setHint() {
  const map = { off: '화면을 눌러 전원을 켜보세요', boot: '', lock: S.bursting ? '알림이 도착하고 있어요' : (D.pin ? '화면이나 홈 버튼을 누르면 잠금이 풀려요' : '홈 버튼을 누르면 열려요'), pin: '암호 4자리를 입력하세요', open: S.phase5 && !S.lastSent ? '화면을 꺼 보세요' : '', sleep: '화면을 누르면 다시 켜져요', busy: '' };
  hintEl.textContent = map[S.phase] || '';
  closeBtn.hidden = !['lock', 'pin', 'open'].includes(S.phase);
  closeBtn.disabled = !!S.call || S.bursting || S.finale;
  inner.classList.toggle('dk', S.phase === 'open' && !!S.route.app && !S.call);
  inner.classList.toggle('slp', S.phase === 'sleep');
}

/* ───────── vibration ───────── */
function setAmp(px) { vib.style.setProperty('--amp', px + 'px'); }
function buzz(ms, amp = 0.4) { if (RM) return; setAmp(amp); vib.classList.add('buzz'); clearTimeout(S.timers.buzz); S.timers.buzz = setTimeout(() => vib.classList.remove('buzz'), ms); }

/* ───────── notifications (lock groups) ───────── */
function lockGroups() {
  const g = [];
  S.kakao.forEach(r => {
    if (r.unread > 0) { const l = lastInfo(r); g.push({ key: 'kakao:' + r.id, app: 'kakao', title: roomName(r), text: (r.group && l.m.from ? l.m.from + ': ' : '') + msgText(l.m), count: r.unread, t: l.m.t, d: l.date }); }
  });
  const miss = S.calls.filter(c => c.type === 'missed' && c.unseen);
  if (miss.length) { const names = [...new Set(miss.map(c => contact(c.who) ? contact(c.who).name : c.who))]; g.push({ key: 'missed', app: 'phone', title: names.join(', '), text: `부재중 전화 ${miss.length}건`, count: miss.length, t: miss.map(c => c.t).sort().pop(), d: TODAY }); }
  S.sms.forEach(r => {
    if (r.unread > 0) { const l = lastInfo(r); g.push({ key: 'sms:' + r.id, app: 'sms', title: roomName(r), text: msgText(l.m).replace(/\n/g, ' '), count: r.unread, t: l.m.t, d: l.date }); }
  });
  const ord = k => { if (k === S.hotKey) return -1; const i = D.lockOrder.indexOf(k); return i < 0 ? 99 : i; };
  g.sort((a, b) => ord(a.key) - ord(b.key) || ((b.d || '') + (b.t || '')).localeCompare((a.d || '') + (a.t || '')));
  return g;
}
function stamp(d, t) { return d && d !== TODAY ? relDay(d) : (t === nowHM() ? '지금' : ampm(t)); }
function ncardHTML(g, cls = '') {
  return `<div class="ncard ${cls}" data-k="${esc(g.key)}"><div class="ai">${ic(g.app)}</div><div class="nb"><div class="nt"><span>${APPNAME[g.app]}</span><span>${stamp(g.d, g.t)}</span></div><div class="nn">${esc(g.title)}${g.count > 1 ? `<span class="cnt">${g.count}</span>` : ''}</div><div class="nx">${esc(g.text)}</div></div></div>`;
}
function groupsHTML(expanded, rise, hotKey) {
  const gs = lockGroups();
  const show = expanded ? gs : gs.slice(0, 3);
  const rest = gs.slice(show.length).reduce((a, g) => a + g.count, 0);
  return show.map((g, i) => {
    const r = rise || g.key === hotKey;
    return ncardHTML(g, r ? 'rise' : '').replace('class="ncard rise"', `class="ncard rise" style="animation-delay:${rise ? i * 0.12 : 0}s"`);
  }).join('') + (rest ? `<button class="more ${rise ? 'rise' : ''}" style="animation-delay:.4s" data-more="1">알림 ${rest}개 더 보기</button>` : '');
}
function burstItems() {
  const items = [];
  const push = (r, kind) => {
    if (!r.unread) return;
    let date = TODAY; const list = [];
    r.msgs.forEach(m => { if (m.date) date = m.date; else if (!m.me) list.push({ m, date }); });
    list.slice(-r.unread).forEach(({ m, date }) => items.push({ app: kind, title: roomName(r), text: (r.group && m.from ? m.from + ': ' : '') + msgText(m).replace(/\n/g, ' '), t: m.t, d: date }));
  };
  S.kakao.forEach(r => push(r, 'kakao'));
  S.calls.filter(c => c.type === 'missed' && c.unseen).forEach(c => items.push({ app: 'phone', title: contact(c.who).name, text: '부재중 전화', t: c.t, d: c.date }));
  S.sms.forEach(r => push(r, 'sms'));
  items.sort((a, b) => (a.d + a.t).localeCompare(b.d + b.t));
  return items;
}

async function burst() {

  await sleep(450);
  if (!RM) { setAmp(0.4); vib.classList.add('buzz'); }
  const n = items.length, tail = [1050, 850, 680, 520, 400, 300, 220];

/* ───────── message delivery ───────── */
function roomVisible(kind, id) { return S.phase === 'open' && !S.call && S.route.app === kind && S.route.room === id; }
function deliver(kind, id, msg) {
  const rooms = kind === 'kakao' ? S.kakao : S.sms;
  let r = rooms.find(x => x.id === id);
  if (!r) { r = { id, name: msg._name, who: D.contacts[id] ? id : undefined, unread: 0, msgs: [] }; rooms.unshift(r); }
  delete msg._name;
  ensureToday(r); msg.t = msg.t || nowHM(); r.msgs.push(msg);
  rooms.splice(rooms.indexOf(r), 1); rooms.unshift(r);
  const vis = roomVisible(kind, id);
  if (!msg.me && !vis) r.unread = (r.unread || 0) + 1;
  S.newKey = kind + ':' + id;
  if (S.phase === 'open') {
    if (S.route.app === kind) { if (vis) S.stickBottom = true; refreshApp(); }
    else if (!S.route.app) renderInner();
    if (!msg.me && !vis && !S.call) banner(kind, r, msg);
  } else if (S.phase === 'lock' && !S.bursting) { updateLockGroups(false, kind + ':' + id); buzz(500, .35); }
  else if (S.phase === 'pin') { buzz(350, .3); }
  S.newKey = null;
  return r;
}
async function aSay(id, lines, abort) {
  for (const text of lines) {
    if (abort && abort()) return false;
    S.typing = id; if (roomVisible('kakao', id)) S.stickBottom = true; refreshIf('kakao');
    await sleep(rnd(350, 700));
    S.typing = null;
    if (abort && abort()) { refreshIf('kakao'); return false; }
    deliver('kakao', id, { text });
  }
  return true;
}

/* ───────── CALENDAR ───────── */
function calView() {
  const sub = S.sub.cal || (S.sub.cal = {});
  if (sub.y == null) { const t = pd(TODAY); sub.y = t.getFullYear(); sub.m = t.getMonth(); sub.sel = TODAY; }
  const first = new Date(sub.y, sub.m, 1), start = new Date(first); start.setDate(1 - first.getDay());
  const last = new Date(sub.y, sub.m + 1, 0);
  const nWeeks = Math.ceil((first.getDay() + last.getDate()) / 7);
  const evs = D.calendar.events.map((e, i) => Object.assign({ i, end: e.end || e.start }, e));
  let weeks = '';
  for (let w = 0; w < nWeeks; w++) {
    const ws = new Date(start); ws.setDate(start.getDate() + w * 7);
    const days = []; for (let k = 0; k < 7; k++) { const d = new Date(ws); d.setDate(ws.getDate() + k); days.push(ds(d)); }
    let cells = days.map((s, k) => {
      const d = pd(s), cls = ['dc'];
      if (k === 0) cls.push('sun'); if (k === 6) cls.push('sat'); if (D.calendar.holidays[s]) cls.push('hol');
      if (d.getMonth() !== sub.m) cls.push('out'); if (s === TODAY) cls.push('today'); if (s === sub.sel) cls.push('sel');
      return `<div class="${cls.join(' ')}" style="grid-column:${k + 1}" data-act="csel" data-d="${s}"><span>${d.getDate()}</span></div>`;
    }).join('');
    const wsS = days[0], weS = days[6];
    const inWeek = evs.filter(e => e.start <= weS && e.end >= wsS).sort((a, b) => a.start.localeCompare(b.start) || b.end.localeCompare(a.end));
    const lanes = [];
    let bars = '';
    inWeek.forEach(e => {
      const c0 = Math.max(0, days.indexOf(e.start < wsS ? wsS : e.start)), c1 = days.indexOf(e.end > weS ? weS : e.end);
      let lane = 0; while (lanes[lane] && lanes[lane].some(([a, b]) => !(c1 < a || c0 > b))) lane++;
      if (lane > 2) return;
      (lanes[lane] = lanes[lane] || []).push([c0, c1]);
      const multi = e.start !== e.end;
      const cls = ['evb']; if (!multi) cls.push('single'); if (e.start < wsS) cls.push('cont-l'); if (e.end > weS) cls.push('cont-r');
      bars += `<div class="${cls.join(' ')}" data-act="csel" data-d="${days[c0]}" style="grid-column:${c0 + 1}/${c1 + 2};grid-row:${lane + 2};background:${e.color}">${multi ? '' : `<i style="background:${e.color}"></i>`}${esc(e.title)}</div>`;
    });
    weeks += `<div class="wk">${cells}${bars}</div>`;
  }
  const selEv = evs.filter(e => e.start <= sub.sel && e.end >= sub.sel);
  const hol = D.calendar.holidays[sub.sel];
  const detail = `<div class="cald"><h3>${fmtMD(sub.sel)}${hol ? `<small>${esc(hol)}</small>` : ''}</h3><div class="scroll" data-sk="cald">${selEv.length ? selEv.map(e => `<div class="evr"><i style="background:${e.color}"></i><div><b>${esc(e.title)}</b><span>${e.start !== e.end ? `${fmtShort(e.start)} ~ ${fmtShort(e.end)} · ` : ''}${esc(e.time || '')}${e.place ? ' · ' + esc(e.place) : ''}</span></div></div>`).join('') : '<div class="noev">일정이 없어요</div>'}</div></div>`;
  return `<div class="ah"><h1 class="big">일정</h1><button class="ib" aria-label="검색">${I.search}</button><button class="ib" aria-label="일정 추가">${I.plus}</button></div><div class="calw"><div class="calm"><div class="calhead"><h2>${sub.y}년 ${sub.m + 1}월</h2><button class="ib" data-act="cmove" data-d="-1" aria-label="이전 달">${I.back}</button><button class="ib" data-act="cmove" data-d="1" aria-label="다음 달">${I.chevR}</button><button class="tb" data-act="ctoday">오늘</button></div><div class="dow">${WD.map(d => `<span>${d}</span>`).join('')}</div><div class="weeks">${weeks}</div></div>${detail}</div>`;
}

  sdelsel: () => { const s = S.sub.sms; const n = s.sel.length; confirmBox(`대화 ${n}개를 삭제할까요?`, '삭제', () => { S.sms = S.sms.filter(r => !s.sel.includes(r.id)); if (s.sel.includes(S.route.room)) S.route.room = null; s.sel = []; s.edit = false; refreshApp(); toast(`대화 ${n}개를 삭제했어요`); }); },
  sdelroom: t => { const id = t.dataset.id; confirmBox('이 대화를 삭제할까요?', '삭제', () => { S.sms = S.sms.filter(r => r.id !== id); S.route.room = null; refreshApp(); toast('대화를 삭제했어요'); }); },
  sbub: (t, e) => {
    $$('.pop', inner).forEach(n => n.remove());
    const i = +t.dataset.i, ir = inner.getBoundingClientRect(), br = t.getBoundingClientRect(), sc = ir.width / inner.offsetWidth;
    const p = el(`<div class="pop"><button>삭제</button></div>`);
    inner.append(p);
    const top = (br.bottom - ir.top) / sc + 4, left = Math.min((br.left - ir.left) / sc, inner.offsetWidth - p.offsetWidth - 10);
    p.style.top = Math.min(top, inner.offsetHeight - p.offsetHeight - 50) + 'px'; p.style.left = Math.max(10, left) + 'px';
    p.querySelector('button').onclick = ev => { ev.stopPropagation(); p.remove(); const r = S.sms.find(x => x.id === S.route.room); if (!r) return; r.msgs.splice(i, 1); cleanDates(r); refreshApp(); toast('메시지를 삭제했어요'); };
    e.stopPropagation();
  },
  dial: () => toast('통화 연결이 되지 않아요'),
  ksend: () => sendFree(),
  gopen: t => { S.sub.gallery.view = +t.dataset.k; refreshApp(); },
  gstep: t => galStep(+t.dataset.d),
  mopen: t => { S.sub.memo.id = t.dataset.id; refreshApp(true); },
  mchk: t => { const m = S.memos.find(x => x.id === t.dataset.id); const c = m.check[+t.dataset.i]; c.done = !c.done; refreshApp(); },
  mbm: () => { const s = S.sub.map; s.pop = !s.pop; refreshApp(); },
  mpick: (t, e) => { if ($('.mapv', view) && $('.mapv', view).dataset.dragged) return; const i = +t.dataset.i, p = D.map.saved[i], s = S.sub.map; s.sel = i; s.pop = false; refreshApp(); requestAnimationFrame(() => mapFocus(p.x * WS, p.y * WS)); },
  mhere: () => { const s = S.sub.map; s.sel = 'here'; s.pop = false; refreshApp(); requestAnimationFrame(() => mapFocus(D.map.here.x * WS, D.map.here.y * WS)); },
  mloc: () => { const s = S.sub.map; mapFocus(D.map.here.x * WS, D.map.here.y * WS); },
  mclose: () => { const s = S.sub.map; s.sel = null; refreshApp(); },
  mapbg: () => {},
  nsearch: () => { S.sub.naver.search = true; refreshApp(true); },
  nrdel: t => { S.recent = S.recent.filter(x => x !== t.dataset.t); refreshApp(); },
  nrall: () => { S.recent = []; refreshApp(); toast('최근 검색어를 모두 지웠어요'); },
  csel: t => { S.sub.cal.sel = t.dataset.d; const d = pd(t.dataset.d); if (d.getMonth() !== S.sub.cal.m) { S.sub.cal.m = d.getMonth(); S.sub.cal.y = d.getFullYear(); } refreshApp(); },
  cmove: t => { const s = S.sub.cal; s.m += +t.dataset.d; if (s.m < 0) { s.m = 11; s.y--; } if (s.m > 11) { s.m = 0; s.y++; } s.sel = ds(new Date(s.y, s.m, 1)); if (ds(new Date(s.y, s.m, 1)).slice(0, 7) === TODAY.slice(0, 7)) s.sel = TODAY; refreshApp(); },
  ctoday: () => { const s = S.sub.cal, t = pd(TODAY); s.y = t.getFullYear(); s.m = t.getMonth(); s.sel = TODAY; refreshApp(); }
};
inner.addEventListener('click', e => {
  if (S.call && e.target.closest('.call')) return;
  if (!e.target.closest('.pop')) $$('.pop', inner).forEach(n => n.remove());
  const t = e.target.closest('[data-act]'); if (!t || !inner.contains(t)) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});

function sendFree() {
  const kf = $('#kfree', view); if (!kf) return;
  const v = kf.value.trim(); if (!v) { kf.focus(); return; }
  S.draft = ''; S.focusFree = true;
  deliver('kakao', S.route.room, { me: true, text: v });
}
inner.addEventListener('input', e => { if (e.target.id === 'kfree') S.draft = e.target.value; });
inner.addEventListener('keydown', e => {
  if (e.target.id === 'kfree') { e.stopPropagation(); if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); sendFree(); } }
});
/* ───────── boot ───────── */
geom(); applyRig();
(async () => {
  S.phase = 'lock'; S.bursting = true; setHint();
  view.innerHTML = lockHTML(); tick();
  await burst();
  S.bursting = false; setHint();
})();
/* 원필 카톡 프사 찾기: contacts.photo → 같은 폴더의 profile.jpg / profile.png … */
(function findProfile() {
  const c = contact(A);
  const list = [c.photo, 'profile.jpg', 'profile.jpeg', 'profile.png', 'profile.JPG', 'profile.JPEG', 'profile.PNG', 'profile.webp'].filter(Boolean);
  c.photo = '';
  const tryAt = i => {
    if (i >= list.length) return;
    const im = new Image();
    im.onload = () => { c.photo = list[i]; if (S.phase === 'open' && S.route.app) refreshApp(); else if (S.phase === 'open') renderInner(); };
    im.onerror = () => tryAt(i + 1);
    im.src = list[i];
  };
  tryAt(0);
})();
})();

</script>
